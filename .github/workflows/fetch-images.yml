name: Copy images from old Weebly site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download every image listed in assets.txt
        run: |
          BASE="https://www.northsideenginecompany.org/uploads/1/2/0/8/1208137"
          fail=0
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            mkdir -p "docs/images/$(dirname "$p")"
            if ! curl -fsSL --retry 3 -o "docs/images/$p" "$BASE/$p"; then echo "FAILED: $p"; fail=$((fail+1)); fi
          done < assets.txt
          echo "Failures: $fail"
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git commit -m "Add images copied from Weebly site" || echo "Nothing new"
          git push
